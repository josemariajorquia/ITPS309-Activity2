{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Ralph Lauren</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@500&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

  <main class="auth-page">
    <section class="auth-card">

      <img src="{% static 'images/ralph-lauren-logo.png' %}" alt="Ralph Lauren" class="logo">

      <h1>Create Account</h1>
      <p class="subtitle">Join us today</p>

      <form id="register-form" novalidate>
        {% csrf_token %}


        <div class="field">
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>
            </svg>
            <input type="text" id="name" name="name" placeholder="Full Name" autocomplete="name" data-rule="name">
          </div>
          <p class="error" id="name-error" role="alert"></p>
        </div>


        <div class="field">
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/>
              <path d="M3.5 7l8.5 6 8.5-6"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" data-rule="email">
          </div>
          <p class="error" id="email-error" role="alert"></p>
        </div>


        <div class="field">
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
              <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
              <circle cx="12" cy="15.5" r="1"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" data-rule="password" data-min-length="8">
            <button type="button" class="toggle-password" aria-controls="password" aria-label="Show password">Show</button>
          </div>
          <p class="error" id="password-error" role="alert"></p>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>

        <p class="form-status" id="form-status" role="status"></p>
      </form>

      <div class="divider"><span>or</span></div>

      <p class="switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>

    </section>
  </main>

  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
